name: Publish to Comfy Registry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publishing credential
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: test -n "$REGISTRY_ACCESS_TOKEN" || { echo 'Add the REGISTRY_ACCESS_TOKEN repository secret'; exit 1; }
      - name: Install validation and publishing tools
        run: python -m pip install comfy-cli==1.22.0 aiohttp==3.13.3 numpy==2.2.6 Pillow==12.3.0
      - name: Validate release
        run: |
          python scripts/check_release.py
          python scripts/sync_node_references.py --check
          python -m unittest discover -s tests -q
          node tests/test_client.mjs
          node tests/test_layout.mjs
          node tests/test_live_image_input.mjs
          node --check web/js/upscale.js
      - name: Publish committed version
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.quotepath
          GIT_CONFIG_VALUE_0: 'false'
        run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN" --changelog-file docs/release-0.1.0.md
